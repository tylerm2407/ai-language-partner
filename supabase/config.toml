# Supabase project config — controls `supabase functions deploy` behavior.
#
# Per-function settings below override the CLI's defaults. This file matters
# most for `verify_jwt` flags: without an entry here, the CLI assumes
# verify_jwt: true and would silently re-enable the platform JWT gate on any
# deploy, reintroducing the UNAUTHORIZED_LEGACY_JWT / UNAUTHORIZED_UNSUPPORTED
# _TOKEN_ALGORITHM errors we worked around.

project_id = "ngqpsuixmumdnqbqxjxv"

# ─── ai-chat ──────────────────────────────────────────────────────────────
# DO NOT change verify_jwt back to true until Supabase's Edge Runtime can
# verify this project's user access tokens natively. The function body
# authenticates every request itself via supabase.auth.getUser(token), which
# handles any signing algorithm. The platform gate is bypassed on purpose.
[functions.ai-chat]
verify_jwt = false

# ─── tts ──────────────────────────────────────────────────────────────────
# Already deploys with verify_jwt: false. Quota tracking + service-role DB
# writes keep per-user limits enforced.
[functions.tts]
verify_jwt = false

# ─── transcribe ───────────────────────────────────────────────────────────
# Already deploys with verify_jwt: false.
[functions.transcribe]
verify_jwt = false

# ─── translate ────────────────────────────────────────────────────────────
# On-demand translation for ChatBubble Translate button. Auth enforced by the
# function body via getAuthenticatedUser (_shared/auth.ts).
[functions.translate]
verify_jwt = false

# ─── daily-news ───────────────────────────────────────────────────────────
# Reads shared per-day articles from the daily_news table and records
# user read-state in user_news_reads. Auth enforced by the function body
# via getAuthenticatedUser (_shared/auth.ts). Keep verify_jwt off until
# the project-wide asymmetric-signing / platform-gateway fix lands,
# otherwise redeploys will resurrect UNAUTHORIZED_LEGACY_JWT errors.
[functions.daily-news]
verify_jwt = false

# ─── daily-news-cron ──────────────────────────────────────────────────────
# Service-role, pg_cron-triggered generator. Authenticates the caller by
# comparing the Authorization Bearer header against SUPABASE_SERVICE_ROLE_KEY
# inside the function body — NOT via the platform JWT gate. Must stay
# verify_jwt = false or the cron's Vault-sourced service-role bearer will
# be rejected by the gate before reaching the function.
[functions.daily-news-cron]
verify_jwt = false

# ─── stripe-webhook ───────────────────────────────────────────────────────
# MUST be false. Stripe cannot present a Supabase JWT, so the platform gate
# rejects every webhook before the handler runs. Auth here is the Stripe
# signature check (stripe.webhooks.constructEvent against
# STRIPE_WEBHOOK_SECRET), which is stronger than the JWT gate for this path.
[functions.stripe-webhook]
verify_jwt = false

# ─── revenuecat-webhook ───────────────────────────────────────────────────
# Same reasoning as stripe-webhook: RevenueCat authenticates via its own
# shared-secret Authorization header, checked in the function body.
[functions.revenuecat-webhook]
verify_jwt = false

# ─── voice-session-token / voice-session-end ──────────────────────────────
# Both authenticate in the function body via getAuthenticatedUser
# (_shared/auth.ts), same as ai-chat, so the platform gate stays off. Without
# these entries the CLI would default them back to verify_jwt = true on the
# next deploy and silently start rejecting this project's user tokens.
[functions.voice-session-token]
verify_jwt = false

[functions.voice-session-end]
verify_jwt = false

# ─── lesson-session ───────────────────────────────────────────────────────
# Redis-backed mid-lesson resume snapshots (one-day expiry). Authenticates in
# the function body via getAuthenticatedUser (_shared/auth.ts) and derives the
# Redis key from the verified user id, so the platform gate stays off for the
# same reason as ai-chat. Requires the UPSTASH_REDIS_REST_URL and
# UPSTASH_REDIS_REST_TOKEN secrets; without them it returns 503
# REDIS_NOT_CONFIGURED and the client falls back to on-device snapshots.
[functions.lesson-session]
verify_jwt = false
