# Supabase project config — controls `supabase functions deploy` behavior.
#
# Per-function settings below override the CLI's defaults. This file matters
# most for `verify_jwt` flags: without an entry here, the CLI assumes
# verify_jwt: true and would silently re-enable the platform JWT gate on any
# deploy, reintroducing the UNAUTHORIZED_LEGACY_JWT / UNAUTHORIZED_UNSUPPORTED
# _TOKEN_ALGORITHM errors we worked around.

project_id = "ngqpsuixmumdnqbqxjxv"

# ─── ai-chat ──────────────────────────────────────────────────────────────
# DO NOT change verify_jwt back to true until Supabase's Edge Runtime can
# verify this project's user access tokens natively. The function body
# authenticates every request itself via supabase.auth.getUser(token), which
# handles any signing algorithm. The platform gate is bypassed on purpose.
[functions.ai-chat]
verify_jwt = false

# ─── tts ──────────────────────────────────────────────────────────────────
# Already deploys with verify_jwt: false. Quota tracking + service-role DB
# writes keep per-user limits enforced.
[functions.tts]
verify_jwt = false

# ─── transcribe ───────────────────────────────────────────────────────────
# Already deploys with verify_jwt: false.
[functions.transcribe]
verify_jwt = false

# ─── translate ────────────────────────────────────────────────────────────
# On-demand translation for the ChatBubble Translate button and for tap-a-word
# lookup in the reader. Auth enforced by the function body via
# getAuthenticatedUser (_shared/auth.ts).
[functions.translate]
verify_jwt = false

# ─── checkpoint ───────────────────────────────────────────────────────────
# The placement/monthly assessment. Auth is enforced by the function body via
# getAuthenticatedUser (_shared/auth.ts) for learner actions, and by a
# service-role bearer compare for the `seed` action — the same split
# daily-news-cron uses. Must stay false or both paths 401 at the gate.
[functions.checkpoint]
verify_jwt = false

# ─── audiobook ────────────────────────────────────────────────────────────
# Narrates a book segment by segment. Auth enforced by the function body via
# getAuthenticatedUser (_shared/auth.ts), entitlement by get_effective_limits.
[functions.audiobook]
verify_jwt = false

# ─── generate-goal-track ──────────────────────────────────────────────────
# Builds a learner's goal track and materialises its lessons. Same posture as
# translate: auth enforced by the function body via getAuthenticatedUser
# (_shared/auth.ts), so the platform gate stays off. Without an entry here the
# CLI would deploy it with verify_jwt = true and every call would 401.
[functions.generate-goal-track]
verify_jwt = false

# ─── explain-passage ──────────────────────────────────────────────────────
# Plain-language explanation of one paragraph in the reader. Same posture as
# translate: auth enforced by the function body via getAuthenticatedUser
# (_shared/auth.ts), so the platform gate stays off. An entry here is not
# optional — without one the CLI would deploy it with verify_jwt = true and
# the reader's Explain button would 401 against this project's access tokens.
[functions.explain-passage]
verify_jwt = false

# ─── daily-news ───────────────────────────────────────────────────────────
# Reads shared per-day articles from the daily_news table and records
# user read-state in user_news_reads. Auth enforced by the function body
# via getAuthenticatedUser (_shared/auth.ts). Keep verify_jwt off until
# the project-wide asymmetric-signing / platform-gateway fix lands,
# otherwise redeploys will resurrect UNAUTHORIZED_LEGACY_JWT errors.
[functions.daily-news]
verify_jwt = false

# ─── daily-news-cron ──────────────────────────────────────────────────────
# Service-role, pg_cron-triggered generator. Authenticates the caller by
# comparing the Authorization Bearer header against SUPABASE_SERVICE_ROLE_KEY
# inside the function body — NOT via the platform JWT gate. Must stay
# verify_jwt = false or the cron's Vault-sourced service-role bearer will
# be rejected by the gate before reaching the function.
[functions.daily-news-cron]
verify_jwt = false

# ─── stripe-webhook ───────────────────────────────────────────────────────
# MUST be false. Stripe cannot present a Supabase JWT, so the platform gate
# rejects every webhook before the handler runs. Auth here is the Stripe
# signature check (stripe.webhooks.constructEvent against
# STRIPE_WEBHOOK_SECRET), which is stronger than the JWT gate for this path.
[functions.stripe-webhook]
verify_jwt = false

# ─── revenuecat-webhook ───────────────────────────────────────────────────
# Same reasoning as stripe-webhook: RevenueCat authenticates via its own
# shared-secret Authorization header, checked in the function body.
[functions.revenuecat-webhook]
verify_jwt = false

# ─── voice-session-token / voice-session-end ──────────────────────────────
# Both authenticate in the function body via getAuthenticatedUser
# (_shared/auth.ts), same as ai-chat, so the platform gate stays off. Without
# these entries the CLI would default them back to verify_jwt = true on the
# next deploy and silently start rejecting this project's user tokens.
[functions.voice-session-token]
verify_jwt = false

[functions.voice-session-end]
verify_jwt = false

# ─── lesson-session ───────────────────────────────────────────────────────
# Redis-backed mid-lesson resume snapshots (one-day expiry). Authenticates in
# the function body via getAuthenticatedUser (_shared/auth.ts) and derives the
# Redis key from the verified user id, so the platform gate stays off for the
# same reason as ai-chat. Requires the UPSTASH_REDIS_REST_URL and
# UPSTASH_REDIS_REST_TOKEN secrets; without them it returns 503
# REDIS_NOT_CONFIGURED and the client falls back to on-device snapshots.
[functions.lesson-session]
verify_jwt = false

# ─── analyze-turn ─────────────────────────────────────────────────────────
# Deployed verify_jwt = false since 2026 (confirmed against the live function
# list) but never recorded here, so the next `functions deploy` would have
# flipped the platform gate back ON and started rejecting this project's user
# tokens — the exact regression the header warns about. The function body
# authenticates via getAuthenticatedUser (_shared/auth.ts), then burst-limits
# and consumes text_messages quota before any model call.
[functions.analyze-turn]
verify_jwt = false

# ─── create-checkout ──────────────────────────────────────────────────────
# Also deployed verify_jwt = false and also unrecorded. It mints Stripe
# Checkout sessions against the CALLER's verified user id, so the auth it
# depends on is its own bearer check, not the gate — but a silent flip to
# true would take subscription purchase down entirely.
[functions.create-checkout]
verify_jwt = false

# ─── news-audio ───────────────────────────────────────────────────────────
# User-facing. Hands back a short-lived signed URL for a daily article's
# narration. Authenticates in the function body via getAuthenticatedUser
# (_shared/auth.ts), same as ai-chat and daily-news, so the platform gate
# stays off. That auth check is the ONLY thing gating access — the
# `news-audio` bucket has no storage.objects policies, so this function's
# service-role client is the only way to mint a playable URL.
[functions.news-audio]
verify_jwt = false

# ─── daily-news-audio-cron ────────────────────────────────────────────────
# Service-role, pg_cron-triggered renderer (migration 079, '20 9,10 * * *').
# Same reasoning as daily-news-cron: the caller is authenticated by a
# constant-time comparison against the Vault-held cron secret inside the
# function body, NOT by the platform JWT gate. Must stay verify_jwt = false
# or the cron's Vault-sourced bearer is rejected before the handler runs.
[functions.daily-news-audio-cron]
verify_jwt = false

# ─── get-hint / generate-content / score-pronunciation ────────────────────
# These three deploy with the platform JWT gate ON, and always have. They are
# recorded here anyway: without an entry the CLI applies its own default, and
# the fact that the default currently matches production is coincidence, not
# intent. The analyze-turn and create-checkout entries above exist because
# exactly that coincidence ran the other way and would have flipped a live
# function on the next deploy.
#
# All three authenticate again inside the function body (getAuthenticatedUser
# for get-hint and score-pronunciation, an explicit auth.getUser for
# generate-content), so the gate is defence in depth rather than the only
# check. Do not set these to false: unlike ai-chat, nothing here needs the
# gate off, and turning it off would remove a layer for no gain.
[functions.get-hint]
verify_jwt = true

[functions.generate-content]
verify_jwt = true

[functions.score-pronunciation]
verify_jwt = true
